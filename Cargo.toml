[workspace]
members = ["engine", "crates/airframe", "crates/sim", "crates/world", "kernels/engine-core", "kernels/terrain-kernel"]
resolver = "2"

# Fast development iteration: rapid compile times, optimized dependencies
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Fast release iteration: near-release runtime speed, fraction of the link cost.
# No LTO on purpose: any LTO disables incremental compilation,
# which forces the full backend on every touch. Cross-crate
# inlining barely matters here (FFI calls plus generics).
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = "none"
incremental = true

# Alias perf to release for backwards compatibility.
[profile.perf]
inherits = "release"

# Ship builds only. Same codegen as release today.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
